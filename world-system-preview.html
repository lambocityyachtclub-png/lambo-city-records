<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d12">
  <title>LAMBO CITY — World System Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090d12; color: #f2eee5; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .panel { position: fixed; z-index: 2; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); width: min(360px, calc(100vw - 28px)); padding: 15px 16px; border: 1px solid rgba(201,168,95,.45); border-radius: 13px; background: rgba(7,11,16,.88); backdrop-filter: blur(12px); box-shadow: 0 12px 40px rgba(0,0,0,.32); }
    .eyebrow { color: #c9a85f; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 6px 0 5px; font-size: 17px; font-weight: 650; letter-spacing: .02em; }
    #status { color: #b9c4c9; font-size: 12px; line-height: 1.5; }
    #metrics { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .metric { border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 6px 8px; color: #e9dfc8; font-size: 11px; }
    .hint { margin-top: 10px; color: #89949b; font-size: 10px; line-height: 1.4; }
    #error { display: none; color: #ffb6a8; margin-top: 8px; font-size: 12px; white-space: pre-wrap; }
    @media (max-width: 600px) { .panel { width: min(310px, calc(100vw - 28px)); } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <section class="panel" aria-live="polite">
    <div class="eyebrow">LAMBO CITY · Development preview</div>
    <h1>World System / Arena District</h1>
    <div id="status">Preparing the district blueprint…</div>
    <div id="metrics"></div>
    <div class="hint">Drag to orbit · Pinch to zoom · Two-finger drag to pan. The second district is a data-only routing fixture; this is not the live game.</div>
    <div id="error"></div>
  </section>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import WorldSystem from "./worldSystem.js";
    import WorldDistrictStreaming from "./worldDistrictStreaming.js";
    import WorldSystemRuntime from "./worldSystemRuntime.js";
    import { createDistrictFromRecipe } from "./worldDistrictFactory.js";
    import { buildParcelGeometry } from "./worldParcelBuilder.js";
    import district from "./worldDistricts/conferenceCenter.js";
    import { validateDistrict } from "./worldDistrictSchema.js";

    const status = document.getElementById("status");
    const metrics = document.getElementById("metrics");
    const error = document.getElementById("error");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d12);
    scene.fog = new THREE.Fog(0x090d12, 180, 360);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 700);
    camera.position.set(-5, 95, 205);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.getElementById("stage").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-43, 7, 97);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 35;
    controls.maxDistance = 300;

    scene.add(new THREE.HemisphereLight(0xdce8f1, 0x25201a, 2.0));
    const key = new THREE.DirectionalLight(0xffe2b0, 2.2);
    key.position.set(-70, 130, -40);
    scene.add(key);

    const arenaGuide = new THREE.Mesh(new THREE.BoxGeometry(54, 8, 44), new THREE.MeshStandardMaterial({ color: 0x101720, transparent: true, opacity: 0.22, wireframe: true }));
    arenaGuide.name = "previewOnlyExistingArenaFootprint";
    arenaGuide.position.set(-43, 4.8, 97);
    scene.add(arenaGuide);

    const grid = new THREE.GridHelper(124, 31, 0x786a4c, 0x393a3b);
    grid.position.set(-43, 0.67, 101.5);
    scene.add(grid);

    try {
      const validation = validateDistrict(district);
      if (!Array.isArray(district.accessTiers) || district.accessTiers.length !== 3) {
        throw new Error("The district must declare all three access tiers.");
      }
      if (!validation.valid) {
        throw new Error(validation.issues.map(item => item.code + ": " + item.message).join("\n"));
      }
      const previewCollision = {
        boxes: [],
        registerBox(name, bounds) { this.boxes.push({ name, ...bounds }); },
        unregister(name) { this.boxes = this.boxes.filter(box => box.name !== name); }
      };
      const world = new WorldSystem();
      world.init(scene, { systems: { collision: previewCollision } });
      const recipeDistrict = createDistrictFromRecipe({
        id: "recipe-compiler-test",
        name: "Recipe Compiler Test",
        type: "coastal-neighborhood",
        bounds: district.bounds,
        roadLoop: {
          bounds: { minX: -80, maxX: -6, minZ: 55, maxZ: 131 },
          width: 9,
          sidewalkWidth: 3,
          pedestrianLoop: true,
          junctions: [{ id: "boulevard-south-access-junction", side: "south", position: -37 }]
        },
        parcelBands: [
          { side: "west", idPrefix: "west-villa", count: 2, fixed: -98.5, start: 80, spacing: 32, style: "coastal-villa", footprint: { width: 13, depth: 11 }, rotationY: Math.PI / 2 },
          { side: "east", idPrefix: "east-villa", count: 2, fixed: 12.5, start: 80, spacing: 32, style: "coastal-villa", footprint: { width: 13, depth: 11 }, rotationY: -Math.PI / 2 },
          { side: "north", idPrefix: "north-villa", count: 2, fixed: 148, start: -58, spacing: 30, style: "coastal-villa", footprint: { width: 13, depth: 11 } }
        ],
        serviceAccess: {
          entry: { id: "boardwalk-service-entry", x: -37, z: 46 },
          connectTo: "boulevard-south-access-junction",
          arrival: { id: "arena-arrival-approach", x: -37, z: 74 },
          requiredAccess: "service",
          gate: { id: "recipe-test-service-gate", offset: 6.5 }
        },
        accessTiers: district.accessTiers,
        terrainZones: district.terrainZones,
        landscapeZones: district.landscapeZones,
        landmarks: district.landmarks
      });
      const recipeValidation = validateDistrict(recipeDistrict);
      if (!recipeValidation.valid || recipeDistrict.parcels.length !== 6 ||
          recipeDistrict.roadNetwork.nodes.length !== 11 ||
          recipeDistrict.roadNetwork.segments.length !== 12) {
        throw new Error("Compact district recipe did not compile into a valid connected blueprint.");
      }
      const gridRecipe = createDistrictFromRecipe({
        id: "grid-recipe-compiler-test",
        name: "Grid Recipe Compiler Test",
        bounds: { minX: 0, maxX: 100, minZ: 0, maxZ: 100 },
        roadLayout: "grid",
        roadGrid: {
          bounds: { minX: 20, maxX: 80, minZ: 20, maxZ: 80 },
          rows: 2, columns: 2, width: 8, sidewalkWidth: 3
        }
      });
      if (gridRecipe.roadNetwork.nodes.length !== 4 || gridRecipe.parcels.length !== 1 ||
          !validateDistrict(gridRecipe).valid) {
        throw new Error("Compact grid recipe did not produce a valid, bounded neighborhood.");
      }
      let oversizedGridRejected = false;
      try {
        createDistrictFromRecipe({
          id: "oversized-grid-test", name: "Oversized Grid Test",
          bounds: { minX: 0, maxX: 100, minZ: 0, maxZ: 100 },
          roadLayout: "grid",
          roadGrid: { bounds: { minX: 20, maxX: 80, minZ: 20, maxZ: 80 }, rows: 17, columns: 2 }
        });
      } catch (_) { oversizedGridRejected = true; }
      if (!oversizedGridRejected) throw new Error("The grid recipe compiler accepted an oversized layout.");

      const registration = world.registerDistrict(district);
      if (!registration.registered) {
        throw new Error(registration.validation.issues.map(item => item.message).join("\n"));
      }

      // Register a second data-only district to exercise city-wide routing.
      const futureDistrict = JSON.parse(JSON.stringify(district));
      futureDistrict.id = "future-district-routing-test";
      futureDistrict.name = "Future District Routing Test";
      futureDistrict.bounds.minX += 300;
      futureDistrict.bounds.maxX += 300;
      futureDistrict.roadNetwork.nodes.forEach(node => { node.x += 300; });
      futureDistrict.parcels.forEach(parcel => { parcel.center.x += 300; });
      futureDistrict.landmarks.forEach(landmark => { landmark.center.x += 300; });
      futureDistrict.landscapeZones.forEach(zone => { zone.center.x += 300; });
      futureDistrict.terrainZones.forEach(zone => { zone.center.x += 300; });
      const futureRegistration = world.registerDistrict(futureDistrict);
      if (!futureRegistration.registered) {
        throw new Error("Future district registration failed: " + futureRegistration.validation.issues.map(item => item.message).join("\\n"));
      }
      const connectionRegistration = world.registerConnection({
        id: "arena-to-future-district-test-link",
        from: { districtId: district.id, nodeId: "boulevard-north-east" },
        to: { districtId: futureDistrict.id, nodeId: "boulevard-south-west" },
        mode: "vehicle",
        access: "public"
      });
      if (!connectionRegistration.registered) {
        throw new Error("Inter-district connector registration failed: " + connectionRegistration.reason);
      }

      // Build a separate fixture to exercise every parcel archetype without
      // adding extra geometry to the main district preview.
      const archetypeDistrict = JSON.parse(JSON.stringify(futureDistrict));
      archetypeDistrict.id = "parcel-archetype-test";
      archetypeDistrict.name = "Parcel Archetype Test";
      archetypeDistrict.parcels[0].style = "luxury-apartment";
      archetypeDistrict.parcels[1].style = "retail-promenade";
      archetypeDistrict.parcels[2].style = "urban-park";
      const archetypeScene = new THREE.Scene();
      const archetypeCollision = {
        boxes: [],
        registerBox(name, bounds) { this.boxes.push({ name, ...bounds }); },
        unregister(name) { this.boxes = this.boxes.filter(box => box.name !== name); }
      };
      const archetypeWorld = new WorldSystem();
      archetypeWorld.init(archetypeScene, { systems: { collision: archetypeCollision } });
      const archetypeRegistration = archetypeWorld.registerDistrict(archetypeDistrict);
      if (!archetypeRegistration.registered) {
        throw new Error("Parcel archetype fixture failed validation.");
      }
      const archetypeRoot = archetypeWorld.buildDistrict(archetypeDistrict.id);
      if (archetypeRoot.userData.buildingCount !== 5 ||
          archetypeRoot.userData.parcelStyles["luxury-apartment"] !== 1 ||
          archetypeRoot.userData.parcelStyles["retail-promenade"] !== 1 ||
          archetypeRoot.userData.parcelStyles["urban-park"] !== 1) {
        throw new Error("Not all parcel archetypes generated correctly.");
      }
      if (archetypeCollision.boxes.length !== 6) {
        throw new Error("The park parcel should remain walkable while buildings and the gate block movement.");
      }
      if (!archetypeWorld.removeDistrict(archetypeDistrict.id) || archetypeCollision.boxes.length !== 0) {
        throw new Error("Removing a generated district did not clean up its collision volumes.");
      }
      const largeGridDistrict = createDistrictFromRecipe({
        id: "large-grid-detail-budget-test",
        name: "Large Grid Detail Budget Test",
        roadLayout: "grid",
        bounds: { minX: 0, maxX: 500, minZ: 0, maxZ: 500 },
        roadGrid: {
          bounds: { minX: 40, maxX: 460, minZ: 40, maxZ: 460 },
          rows: 8,
          columns: 8,
          width: 8,
          sidewalkWidth: 3,
          parcelStyles: ["coastal-villa", "luxury-apartment", "retail-promenade", "urban-park"]
        }
      });
      const largeGridValidation = validateDistrict(largeGridDistrict);
      if (!largeGridValidation.valid || largeGridDistrict.parcels.length !== 49) {
        throw new Error("The large grid performance fixture did not produce 49 valid parcels.");
      }
      const largeParcelRoot = new THREE.Group();
      const largeParcelResult = buildParcelGeometry(largeParcelRoot, largeGridDistrict, {
        focusPosition: { x: 250, z: 250 },
        maxDetailedParcels: 12
      });
      if (largeParcelResult.detailCount !== 12 || largeParcelResult.proxyCount !== 37 ||
          largeParcelResult.proxyBatchCount !== 4 || largeParcelResult.buildings !== 37) {
        throw new Error("Large districts did not cap detailed buildings and batch distant parcel proxies.");
      }
      largeParcelRoot.traverse(object => object.geometry?.dispose?.());
      largeParcelResult.ownedMaterials.forEach(material => material.dispose?.());

      const districtStreamer = new WorldDistrictStreaming({
        streamInRadius: 50,
        streamOutRadius: 75,
        maxBuildsPerUpdate: 1,
        maxRemovalsPerUpdate: 1
      }).init(archetypeWorld);
      districtStreamer.update(0, { playerPosition: { x: 1000, z: 1000 } });
      if (archetypeWorld.isDistrictBuilt(archetypeDistrict.id)) {
        throw new Error("A distant district was built before entering its stream range.");
      }
      districtStreamer.update(0, { playerPosition: { x: 257, z: 100 } });
      if (!archetypeWorld.isDistrictBuilt(archetypeDistrict.id)) {
        throw new Error("A nearby district did not stream in.");
      }
      districtStreamer.update(0, { playerPosition: { x: 379, z: 100 } });
      if (!archetypeWorld.isDistrictBuilt(archetypeDistrict.id)) {
        throw new Error("District hysteresis removed detail too early.");
      }
      districtStreamer.update(0, { playerPosition: { x: 409, z: 100 } });
      if (archetypeWorld.isDistrictBuilt(archetypeDistrict.id) || archetypeCollision.boxes.length !== 0) {
        throw new Error("A distant district did not stream out and clean up its colliders.");
      }
      const runtimeScene = new THREE.Scene();
      const runtimeCollision = {
        boxes: [],
        registerBox(name, bounds) { this.boxes.push({ name, ...bounds }); },
        unregister(name) { this.boxes = this.boxes.filter(box => box.name !== name); }
      };
      const runtime = new WorldSystemRuntime();
      await runtime.init(runtimeScene, { systems: { collision: runtimeCollision } }, {
        districts: [recipeDistrict],
        streamingOptions: { streamInRadius: 50, streamOutRadius: 75 }
      });
      if (runtime.getDistrictAtPosition(-43, 97)?.id !== recipeDistrict.id ||
          Math.abs(runtime.getGroundHeightAt(-60, 55) - 0.77) > 0.001) {
        throw new Error("The runtime bridge did not expose coordinate-based district and ground lookup.");
      }
      if (!runtime.getStatus().ready || !runtime.getStatus().registeredDistrictIds.includes(recipeDistrict.id)) {
        throw new Error("The runtime bridge did not report its registered district state.");
      }
      runtime.update(0, { playerPosition: { x: -43, z: 100 } });
      if (!runtime.getWorldSystem().isDistrictBuilt(recipeDistrict.id) ||
          !runtime.getStatus().builtDistricts.includes(recipeDistrict.id)) {
        throw new Error("The lazy runtime bridge did not build a nearby district.");
      }
      runtime.update(0, { playerPosition: { x: 1000, z: 1000 } });
      if (runtime.getWorldSystem().isDistrictBuilt(recipeDistrict.id) || runtimeCollision.boxes.length !== 0) {
        throw new Error("The runtime bridge did not stream out and clean up the district.");
      }
      runtime.dispose();
      if (runtime.getWorldSystem() !== null || runtime.ready || runtime.getStatus().registeredDistrictIds.length !== 0) {
        throw new Error("The runtime bridge did not dispose cleanly.");
      }

      const rollbackCollision = {
        boxes: [],
        registerBox(name, bounds) { this.boxes.push({ name, ...bounds }); },
        unregister(name) { this.boxes = this.boxes.filter(box => box.name !== name); }
      };
      const rollbackRuntime = new WorldSystemRuntime();
      let rollbackRejected = false;
      try {
        await rollbackRuntime.init(new THREE.Scene(), { systems: { collision: rollbackCollision } }, {
          districts: [recipeDistrict, {
            ...recipeDistrict,
            id: "invalid-runtime-district",
            roadNetwork: { nodes: [], segments: [] }
          }]
        });
      } catch (runtimeError) {
        rollbackRejected = String(runtimeError?.message || runtimeError).includes("invalid-runtime-district");
      }
      if (!rollbackRejected || rollbackRuntime.ready || rollbackRuntime.getWorldSystem() !== null ||
          rollbackCollision.boxes.length !== 0) {
        throw new Error("A failed runtime initialization did not roll back its earlier district registrations.");
      }

      const root = world.buildDistrict(district.id, { roadTopY: 0.77, sidewalkTopY: 0.82, roadWidth: 9, sidewalkWidth: 3 });
      if (root.userData.terrainZoneCount !== district.terrainZones.length ||
          root.userData.terrainSurfaceCount !== district.terrainZones.length) {
        throw new Error("Not all declared terrain grades were generated.");
      }
      const terrainRoot = root.children.find(child => child.name === "worldTerrain_" + district.id);
      const terrainFinishCount = terrainRoot?.children.filter(child => child.name.startsWith("worldTerrainZone_")).length || 0;
      const courtyardMesh = terrainRoot?.children.find(child => child.name === "worldLandscapeZone_north-villa-courtyard");
      if (terrainFinishCount !== district.terrainZones.length || !courtyardMesh ||
          Math.abs(courtyardMesh.position.y - 0.705) > 0.001) {
        throw new Error("Terrain finish meshes or local-grade landscape placement are incorrect.");
      }
      const invalidLandscapeDensity = structuredClone(district);
      invalidLandscapeDensity.landscapeZones[0].treeCount = 99;
      const densityValidation = validateDistrict(invalidLandscapeDensity);
      const invalidTerrainFinish = structuredClone(district);
      invalidTerrainFinish.terrainZones[0].materialColor = -1;
      const finishValidation = validateDistrict(invalidTerrainFinish);
      if (densityValidation.valid || !densityValidation.issues.some(item => item.code === "INVALID_LANDSCAPE_DENSITY") ||
          finishValidation.valid || !finishValidation.issues.some(item => item.code === "INVALID_TERRAIN_COLOR")) {
        throw new Error("Landscape density and terrain finish validation did not reject invalid values.");
      }
      if (world.getDistrictAtPosition(-43, 97)?.id !== district.id ||
          Math.abs(world.getGroundHeightAt(-60, 55) - 0.77) > 0.001 ||
          world.getDistrictAtPosition(1000, 1000) !== null) {
        throw new Error("World-coordinate district lookup or automatic ground sampling failed.");
      }
      const plazaGroundY = world.getGroundHeight(district.id, -50, 64.5);
      const courtyardGroundY = world.getGroundHeight(district.id, -43, 148);
      const baseGroundY = world.getGroundHeight(district.id, -100, 70);
      const roadGroundY = world.getGroundHeight(district.id, -60, 55);
      const sidewalkGroundY = world.getGroundHeight(district.id, -60, 49);
      const approachSidewalkGroundY = world.getGroundHeight(district.id, -43, 64.5);
      if (Math.abs(plazaGroundY - 0.68) > 0.001 ||
          Math.abs(courtyardGroundY - 0.70) > 0.001 ||
          Math.abs(baseGroundY - 0.64) > 0.001 ||
          Math.abs(roadGroundY - 0.77) > 0.001 ||
          Math.abs(sidewalkGroundY - 0.82) > 0.001 ||
          Math.abs(approachSidewalkGroundY - 0.82) > 0.001) {
        throw new Error("Terrain height sampling does not match the generated grade data.");
      }
      const failedBuildCollision = {
        boxes: [],
        calls: 0,
        registerBox(name, bounds) {
          this.calls++;
          if (this.calls === 2) throw new Error("intentional collision registration failure");
          this.boxes.push({ name, ...bounds });
        },
        unregister(name) { this.boxes = this.boxes.filter(box => box.name !== name); }
      };
      let buildRollbackObserved = false;
      try {
        world.buildDistrict(futureDistrict.id, { collision: failedBuildCollision });
      } catch (buildError) {
        buildRollbackObserved = String(buildError?.message || buildError).includes("intentional collision registration failure");
      }
      if (!buildRollbackObserved || failedBuildCollision.boxes.length !== 0 ||
          world.isDistrictBuilt(futureDistrict.id) ||
          scene.children.some(child => child.name === "worldSystemDistrict_" + futureDistrict.id)) {
        throw new Error("A failed district build did not roll back its geometry and collision registrations.");
      }

      const noPermissionServiceRoute = world.findRoute(
        district.id,
        "boardwalk-service-entry",
        "arena-arrival-approach",
        { mode: "service" }
      );
      const gateBeforeAuthorization = world.getGateStatuses(district.id)[0];
      const servicePermissionWithClosedGate = world.findRoute(
        district.id,
        "boardwalk-service-entry",
        "arena-arrival-approach",
        { mode: "service", permissions: ["service"] }
      );
      const gateGrant = world.setGateAccess(district.id, "arena-boardwalk-service-gate", ["service"]);
      const authorizedServiceRoute = world.findRoute(
        district.id,
        "boardwalk-service-entry",
        "arena-arrival-approach",
        { mode: "service", permissions: ["service"] }
      );
      const pedestrianRoute = world.findRoute(
        district.id,
        "walk-south-west",
        "arena-arrival-approach",
        { mode: "pedestrian" }
      );
      const ordinaryTrafficRoute = world.findRoute(
        district.id,
        "boardwalk-service-entry",
        "arena-arrival-approach",
        { mode: "vehicle" }
      );
      const deniedCityRoute = world.findWorldRoute(
        district.id, "boardwalk-service-entry",
        futureDistrict.id, "boulevard-south-west",
        { mode: "service" }
      );
      const authorizedCityRoute = world.findWorldRoute(
        district.id, "boardwalk-service-entry",
        futureDistrict.id, "boulevard-south-west",
        { mode: "service", permissions: ["service"] }
      );
      if (servicePermissionWithClosedGate.found) {
        throw new Error("A route was exposed through a physical gate before it opened.");
      }
      if (!gateBeforeAuthorization || gateBeforeAuthorization.open !== false) {
        throw new Error("The restricted boardwalk gate did not start closed.");
      }
      if (previewCollision.boxes.length !== district.parcels.length + 1) {
        throw new Error("Expected one collider per villa plus the closed service gate.");
      }
      if (noPermissionServiceRoute.found) {
        throw new Error("Service route was incorrectly allowed without permission.");
      }
      if (!gateGrant.updated || !gateGrant.gate?.open || !authorizedServiceRoute.found) {
        throw new Error("Authorized service access did not open the gate and enable the route.");
      }
      if (ordinaryTrafficRoute.found) {
        throw new Error("Ordinary vehicle traffic incorrectly received restricted access.");
      }
      if (!pedestrianRoute.found) {
        throw new Error("The continuous pedestrian sidewalk route did not reach the arena arrival point.");
      }
      if (archetypeCollision.boxes.length !== 0) {
        throw new Error("Temporary archetype collision data leaked after cleanup.");
      }
      if (deniedCityRoute.found || !authorizedCityRoute.found) {
        throw new Error("City-wide routing did not preserve restricted access across district connections.");
      }
      if (previewCollision.boxes.length !== district.parcels.length) {
        throw new Error("Opening the service gate did not remove its collision blocker.");
      }

      const registeredDistrictCount = world.getDistrictIds().length;
      const registeredConnectionCount = world.getStatus().registeredConnections.length;

      // Removing a district must release its blockers and any inter-district links.
      const districtRemoved = world.unregisterDistrict(district.id);
      if (!districtRemoved || previewCollision.boxes.length !== 0 ||
          world.getStatus().registeredConnections.length !== 0 ||
          world.getDistrictIds().includes(district.id)) {
        throw new Error("District removal did not clean up collision blockers and city connections.");
      }
      status.textContent = "All district, terrain, parcel, pedestrian, city-route, collision, gate, and cleanup checks passed. Isolated from live gameplay.";

      metrics.innerHTML = [
        ["Roads", root.userData.roadCount],
        ["Junctions", root.userData.junctionCount],
        ["Sidewalk sections", root.userData.sidewalkCount],
        ["Villa parcels", root.userData.parcelCount],
        ["Access tiers", district.accessTiers.length],
        ["Terrain grades / surfaces", root.userData.terrainZoneCount + " / " + root.userData.terrainSurfaceCount],
        ["Terrain height samples", "verified"],
        ["Terrain finishes / planting grade", "verified"],
        ["Landscape limits", "verified"],
        ["Road / sidewalk grounding", "verified"],
        ["Coordinate-based world lookup", "verified"],
        ["Landscape zones", root.userData.landscapeZoneCount],
        ["Landscape features", root.userData.landscapeFeatureCount],
        ["Closed gate blocks authorized route", servicePermissionWithClosedGate.found ? "failed" : "verified"],
        ["Service gate before grant", gateBeforeAuthorization?.open ? "open" : "closed"],
        ["Service gate after grant", gateGrant.gate?.open ? "open" : "closed"],
        ["Service route without permission", noPermissionServiceRoute.found ? "unexpected" : "blocked"],
        ["Authorized service route", authorizedServiceRoute.found ? "available" : "blocked"],
        ["Pedestrian sidewalk route", pedestrianRoute.found ? "available" : "blocked"],
        ["Ordinary vehicle route", ordinaryTrafficRoute.found ? "unexpected" : "restricted"],
        ["Registered districts before cleanup", registeredDistrictCount],
        ["Inter-district links before cleanup", registeredConnectionCount],
        ["Cross-district route", authorizedCityRoute.found ? "available" : "blocked"],
        ["Cross-district without permission", deniedCityRoute.found ? "unexpected" : "blocked"],
        ["District cleanup", "verified"],
        ["Colliders after cleanup", previewCollision.boxes.length],
        ["Parcel archetypes", "4 supported"],
        ["Archetype cleanup", "verified"],
        ["District streaming", "hysteresis verified"],
        ["Large-district parcel detail", "12 detailed + 37 instanced proxies"],
        ["Loop / grid recipe compiler", "verified"],
        ["iPad recipe size limits", "verified"],
        ["Runtime rollback", "verified"],
        ["District build rollback", "verified"]
      ].map(([label, value]) => '<span class="metric">' + label + ': ' + value + '</span>').join("");
    } catch (err) {
      status.textContent = "The district could not be generated.";
      error.style.display = "block";
      error.textContent = String(err?.stack || err);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    }
    window.addEventListener("resize", resize);
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>

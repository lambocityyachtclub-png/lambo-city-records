name: LAMBO CITY startup safety checks

on:
  pull_request:
  push:
    branches: ["restore/**"]

jobs:
  startup-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run startup isolation regression tests
        run: node --test tests/startup-isolation.test.mjs
      - name: Verify approved camera baseline
        run: node scripts/test-camera-baseline.mjs
      - name: Verify world startup wiring
        run: node scripts/test-world-startup-wiring.mjs
      - name: Verify streamed engine registration
        run: node --experimental-default-type=module scripts/test-engine-dynamic-systems.mjs
      - name: Check world startup wiring regressions
        run: node scripts/test-world-startup-wiring.mjs
      - name: Syntax-check every JavaScript module
        run: node scripts/check-all-js-syntax.mjs

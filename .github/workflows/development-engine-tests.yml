
name: Development Engine Tests

on:
  push:
    paths:
      - "development/**"
      - ".github/workflows/development-engine-tests.yml"

  pull_request:
    paths:
      - "development/**"
      - ".github/workflows/development-engine-tests.yml"

  workflow_dispatch:

jobs:
  test:
    name: Test Development Engine
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run development engine and blueprint discovery tests
        run: node --experimental-default-type=module --test development/tests/*.test.js

      - name: Generate read-only ALIVE blueprint discovery report
        run: node development/blueprints/discoverBlueprints.mjs

      - name: Upload read-only ALIVE discovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alive-blueprint-discovery
          path: development/planning/blueprint-discovery/
          if-no-files-found: error
          retention-days: 7

name: Development Engine Tests

on:
  push:
    branches:
      - integration/lc-alive-agentic-worker-2026-11-10
    paths:
      - "development/**"
      - "development/queue/incoming/**"
      - "scripts/validate-alive-worker-diff.mjs"
      - "scripts/test-alive-worker-diff-gate.mjs"
      - "scripts/resolve-alive-private-task.mjs"
      - "api/alive/**"
      - "server/alive/**"
      - "alive.html"
      - "alive.js"
      - "alive.css"
      - "vercel.json"
      - ".github/workflows/development-engine-tests.yml"

  pull_request:
    paths:
      - "development/**"
      - "api/alive/**"
      - "server/alive/**"
      - "alive.html"
      - "alive.js"
      - "alive.css"
      - "vercel.json"
      - ".github/workflows/development-engine-tests.yml"

  workflow_dispatch:

jobs:
  test:
    name: Test Development Engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete Development Engine test suite
        run: |
          node --experimental-default-type=module --test development/tests/*.test.js

      - name: Syntax-check private ALIVE owner workspace
        run: |
          node --check alive.js
          node --experimental-default-type=module --check api/alive/session.js
          node --experimental-default-type=module --check api/alive/vision.js
          node --experimental-default-type=module --check api/alive/status.js
          node --experimental-default-type=module --check api/alive/private-task.js
          node --experimental-default-type=module --check server/alive/githubActionsOidc.js
          node --experimental-default-type=module --check server/alive/security.js
          node --experimental-default-type=module --check server/alive/visionTask.js
          node -e 'JSON.parse(require("node:fs").readFileSync("vercel.json", "utf8"))'

      - name: Test worker path and file-type validation
        run: node --experimental-default-type=module scripts/test-alive-worker-diff-gate.mjs

  resolve-task:
    name: Resolve one authorized ALIVE task
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      has_task: ${{ steps.task.outputs.has_task }}
      task_id: ${{ steps.task.outputs.task_id }}
      worker_id: ${{ steps.task.outputs.worker_id }}
      title: ${{ steps.task.outputs.title }}
      base_sha: ${{ steps.task.outputs.base_sha }}
      proposal_base_sha: ${{ steps.task.outputs.proposal_base_sha }}
    steps:
      - name: Check out queued commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify and validate one queued task
        id: task
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}

        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "has_task=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t task_files < <(git diff --diff-filter=AM --name-only "$BEFORE_SHA" "$HEAD_SHA" -- 'development/queue/incoming/*.json')
          if [[ "${#task_files[@]}" -eq 0 ]]; then
            echo "has_task=false" >> "$GITHUB_OUTPUT"
            echo "No ALIVE task was queued in this push; skipping specialist generation."
            exit 0
          fi
          if [[ "${#task_files[@]}" -ne 1 || ! -f "${task_files[0]}" ]]; then
            echo "Each queue commit must add or update exactly one JSON task." >&2
            exit 1
          fi
          TASK_FILE="${task_files[0]}"
          if node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); process.exit(p && p.privateQueue ? 0 : 1)' "$TASK_FILE"; then
            PRIVATE_TASK_ID="$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(String(p.id || ""))' "$TASK_FILE")"
            OIDC_RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Falive-preview.lambocityrecords.com%2Fapi%2Falive%2Fprivate-task")"
            OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -er '.value')"
            TASK_RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg taskId "$PRIVATE_TASK_ID" '{taskId:$taskId}')" \
              "https://alive-preview.lambocityrecords.com/api/alive/private-task")"
            printf '%s' "$TASK_RESPONSE" | jq -e '.task' > /tmp/alive-private-task.json
            TASK_FILE="/tmp/alive-private-task.json"
          fi
          node --experimental-default-type=module scripts/prepare-alive-worker-task.mjs "$TASK_FILE" /tmp/alive-worker-prompt.md /tmp/alive-worker-metadata.json
          TASK_ID="$(node -e 'const m=require("/tmp/alive-worker-metadata.json"); process.stdout.write(m.id)')"
          WORKER_ID="$(node -e 'const m=require("/tmp/alive-worker-metadata.json"); process.stdout.write(m.workerId)')"
          TITLE="$(node -e 'const m=require("/tmp/alive-worker-metadata.json"); process.stdout.write(m.title.replace(/[\r\n]/g," "))')"
          echo "has_task=true" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "worker_id=$WORKER_ID" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "proposal_base_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload prepared private task input
        if: steps.task.outputs.has_task == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alive-worker-input-${{ steps.task.outputs.task_id }}
          path: |
            /tmp/alive-worker-prompt.md
            /tmp/alive-worker-metadata.json
          if-no-files-found: error
          retention-days: 1

  generate-proposal:
    name: Generate scoped specialist proposal
    needs: resolve-task
    if: needs.resolve-task.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Check out queued commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-task.outputs.proposal_base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download prepared private task input
        uses: actions/download-artifact@v4
        with:
          name: alive-worker-input-${{ needs.resolve-task.outputs.task_id }}
          path: /tmp/alive-worker-input
      - name: Stage prepared task prompt
        run: |
          cp /tmp/alive-worker-input/alive-worker-prompt.md /tmp/alive-worker-prompt.md
          cp /tmp/alive-worker-input/alive-worker-metadata.json /tmp/alive-worker-metadata.json
      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.108
      - name: Verify Copilot CLI version
        run: copilot --version | tee /tmp/copilot-version.txt && grep -F "1.0.108" /tmp/copilot-version.txt
      - name: Return to clean base before code generation
        env:
          BASE_SHA: ${{ needs.resolve-task.outputs.base_sha }}
        run: git checkout "$BASE_SHA"
      - name: Generate code in disposable runner
        if: needs.resolve-task.outputs.has_task == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot -p "$(cat /tmp/alive-worker-prompt.md)" -s \
            --available-tools='edit,view,grep,glob,create,apply_patch' \
            --allow-tool='write' \
            --deny-tool='shell' --deny-tool='url' --deny-tool='memory'
      - name: Validate paths and package patch
        if: needs.resolve-task.outputs.has_task == 'true'
        env:
          WORKER_ID: ${{ needs.resolve-task.outputs.worker_id }}
          TASK_ID: ${{ needs.resolve-task.outputs.task_id }}
        run: |
          set -euo pipefail
          git add -N -- .
          git diff --no-renames --name-only HEAD > /tmp/alive-worker-changed-files.txt
          node --experimental-default-type=module scripts/validate-alive-worker-diff.mjs "$WORKER_ID" /tmp/alive-worker-changed-files.txt
          git diff --binary HEAD > /tmp/alive-worker.patch
          test -s /tmp/alive-worker.patch
          cp /tmp/alive-worker-changed-files.txt alive-worker-changed-files.txt
          cp /tmp/alive-worker.patch alive-worker.patch
          cp /tmp/alive-worker-metadata.json alive-worker-metadata.json
          printf '# Specialist report\n\nTask: %s\nWorker: %s\n\nChanged files:\n' "$TASK_ID" "$WORKER_ID" > alive-worker-report.md
          sed 's/^/- /' alive-worker-changed-files.txt >> alive-worker-report.md
      - name: Upload isolated proposal artifact
        if: needs.resolve-task.outputs.has_task == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alive-worker-proposal-${{ needs.resolve-task.outputs.task_id }}
          path: |
            alive-worker.patch
            alive-worker-changed-files.txt
            alive-worker-metadata.json
            alive-worker-report.md
          if-no-files-found: error
          retention-days: 7

  test-proposal:
    name: Test proposal without write credentials
    needs: [resolve-task, generate-proposal]
    if: needs.resolve-task.outputs.has_task == 'true' && needs.generate-proposal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out clean base without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-task.outputs.proposal_base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download isolated proposal artifact
        uses: actions/download-artifact@v4
        with:
          name: alive-worker-proposal-${{ needs.resolve-task.outputs.task_id }}
          path: /tmp/alive-worker-proposal
      - name: Apply patch and repeat the path and file-type gate
        env:
          WORKER_ID: ${{ needs.resolve-task.outputs.worker_id }}
        run: |
          set -euo pipefail
          git apply --check /tmp/alive-worker-proposal/alive-worker.patch
          git apply /tmp/alive-worker-proposal/alive-worker.patch
          node --experimental-default-type=module scripts/validate-alive-worker-diff.mjs "$WORKER_ID" /tmp/alive-worker-proposal/alive-worker-changed-files.txt
          git diff --check
      - name: Run complete Development Engine tests without write credentials
        run: |
          node --experimental-default-type=module --test development/tests/*.test.js

  publish-draft-pr:
    name: Publish tested proposal as a draft PR
    needs: [resolve-task, generate-proposal, test-proposal]
    if: needs.resolve-task.outputs.has_task == 'true' && needs.test-proposal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out clean base without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-task.outputs.proposal_base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download tested proposal artifact
        uses: actions/download-artifact@v4
        with:
          name: alive-worker-proposal-${{ needs.resolve-task.outputs.task_id }}
          path: /tmp/alive-worker-proposal
      - name: Apply patch and repeat the path and file-type gate
        env:
          WORKER_ID: ${{ needs.resolve-task.outputs.worker_id }}
        run: |
          set -euo pipefail
          git apply --check /tmp/alive-worker-proposal/alive-worker.patch
          git apply /tmp/alive-worker-proposal/alive-worker.patch
          node --experimental-default-type=module scripts/validate-alive-worker-diff.mjs "$WORKER_ID" /tmp/alive-worker-proposal/alive-worker-changed-files.txt
          git diff --check
      - name: Publish isolated branch and draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.resolve-task.outputs.task_id }}
          TASK_TITLE: ${{ needs.resolve-task.outputs.title }}
          WORKER_ID: ${{ needs.resolve-task.outputs.worker_id }}
          BASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="alive-proposal/$TASK_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(alive): $TASK_TITLE"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:refs/heads/$BRANCH"
          cat > /tmp/alive-worker-pr-body.md <<EOF
          ## LAMBO CITY ALIVE specialist proposal

          - **Task:** $TASK_ID
          - **Worker:** $WORKER_ID
          - **Base:** $BASE_BRANCH
          - **Automated Development Engine tests:** passed in a separate read-only job

          This is an isolated, AI-generated proposal. Generated code was tested in a separate job with no repository write credentials. This publishing job revalidates the worker path and file-type gate, then creates this draft PR without executing the generated code.

          No production branch changes were made. No merge or deployment was performed. Studio/World checks run when their corresponding code paths are changed.
          EOF
          gh pr create --draft --base "$BASE_BRANCH" --head "$BRANCH" \\
            --title "[ALIVE] $TASK_TITLE" \\
            --body-file /tmp/alive-worker-pr-body.md

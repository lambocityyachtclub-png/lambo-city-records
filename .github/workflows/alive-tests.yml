name: ALIVE Development Tests

on:
  pull_request:
    paths:
      - "development/**"
      - ".github/workflows/alive-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alive-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ALIVE development test suite
        run: node --experimental-default-type=module --test development/tests/*.test.js

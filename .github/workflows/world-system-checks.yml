name: World System Checks

on:
  push:
    paths:
      - "main.js"
      - "engine.js"
      - "npc.js"
      - "characterSystem.js"
      - "dockLife.js"
      - "stageMusic.js"
      - "stageCrowdPulse.js"
      - "stageSpotlights.js"
      - "stageLasers.js"
      - "stageLiveDrummer.js"
      - "stageFireworks.js"
      - "heroPerformance.js"
      - "scripts/test-dock-life.mjs"
      - "scripts/test-concert-audio-approach.mjs"
      - "scripts/test-song-clock-stage-reactions.mjs"
      - "scripts/test-hero-song-choreography.mjs"
      - "scripts/test-stage-music-lifecycle.mjs"
      - "scripts/test-live-stage-drummer.mjs"
      - "scripts/test-hero-finale-fireworks.mjs"
      - "scripts/test-character-system.mjs"
      - "scripts/test-crowd-song-synchronization.mjs"
      - "input.js"
      - "player.js"
      - "marina.js"
      - "waterfrontStorefrontDetails.js"
      - "world.js"
      - "cityMap.js"
      - "conferenceCenterDistrict.js"
      - "dock.js"
      - "dockPath.js"
      - "dockLuxuryOverhaul.js"
      - "grandStagePier.js"
      - "dockMaterialPalette.js"
      - "sidewalkSurface.js"
      - "scripts/test-world-material-cohesion.mjs"
      - "water.js"
      - "scripts/test-player-controller.mjs"
      - "scripts/test-waterfront-storefront-details.mjs"
      - ".github/workflows/world-system-checks.yml"
  pull_request:
    paths:
      - "main.js"
      - "engine.js"
      - "npc.js"
      - "characterSystem.js"
      - "dockLife.js"
      - "stageMusic.js"
      - "stageCrowdPulse.js"
      - "stageSpotlights.js"
      - "stageLasers.js"
      - "stageLiveDrummer.js"
      - "heroPerformance.js"
      - "scripts/test-dock-life.mjs"
      - "scripts/test-concert-audio-approach.mjs"
      - "scripts/test-song-clock-stage-reactions.mjs"
      - "scripts/test-hero-song-choreography.mjs"
      - "scripts/test-stage-music-lifecycle.mjs"
      - "scripts/test-live-stage-drummer.mjs"
      - "scripts/test-character-system.mjs"
      - "input.js"
      - "player.js"
      - "marina.js"
      - "waterfrontStorefrontDetails.js"
      - "world.js"
      - "cityMap.js"
      - "conferenceCenterDistrict.js"
      - "dock.js"
      - "dockPath.js"
      - "dockLuxuryOverhaul.js"
      - "grandStagePier.js"
      - "dockMaterialPalette.js"
      - "sidewalkSurface.js"
      - "scripts/test-world-material-cohesion.mjs"
      - "water.js"
      - "scripts/test-player-controller.mjs"
      - "scripts/test-waterfront-storefront-details.mjs"
      - ".github/workflows/world-system-checks.yml"
  workflow_dispatch:
jobs:
  world:
    name: Validate World Modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check world module syntax
        run: |
          for file in main.js engine.js npc.js characterSystem.js dockLife.js stageMusic.js stageCrowdPulse.js stageSpotlights.js stageLasers.js stageLiveDrummer.js stageFireworks.js heroPerformance.js input.js player.js marina.js waterfrontStorefrontDetails.js world.js cityMap.js conferenceCenterDistrict.js dock.js dockPath.js dockLuxuryOverhaul.js grandStagePier.js dockMaterialPalette.js sidewalkSurface.js water.js
          do
            node --experimental-default-type=module --check "$file"
          done
      - name: Test bounded dock visitors and ambient chatter
        run: node --experimental-default-type=module scripts/test-dock-life.mjs
      - name: Test concert approach audio and HERO trigger
        run: node --experimental-default-type=module scripts/test-concert-audio-approach.mjs
      - name: Test song-clock stage reactions
        run: node --experimental-default-type=module scripts/test-song-clock-stage-reactions.mjs
      - name: Test HERO song-driven choreography
        run: node --experimental-default-type=module scripts/test-hero-song-choreography.mjs
      - name: Test HERO stage music one-shot lifecycle
        run: node --experimental-default-type=module scripts/test-stage-music-lifecycle.mjs
      - name: Test live stage drummer
        run: node --experimental-default-type=module scripts/test-live-stage-drummer.mjs
      - name: Test HERO finale fireworks
        run: node --experimental-default-type=module scripts/test-hero-finale-fireworks.mjs
      - name: Test protected player controller directions and movement
        run: node --experimental-default-type=module scripts/test-player-controller.mjs
      - name: Test additive waterfront storefront integration
        run: node --experimental-default-type=module scripts/test-waterfront-storefront-details.mjs
      - name: Test dock, pier, and sidewalk material cohesion
        run: node --experimental-default-type=module scripts/test-world-material-cohesion.mjs
      - name: Test LAMBO CITY character identities and crowd behavior
        run: node --experimental-default-type=module scripts/test-character-system.mjs
      - name: Test concert crowd song synchronization
        run: node --experimental-default-type=module scripts/test-crowd-song-synchronization.mjs

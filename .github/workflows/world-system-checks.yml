name: World System Checks

on:
  push:
    branches:
      - feature/lambo-city-completion
  pull_request:
    paths:
      - "world*.js"
      - "worldDistricts/**"
      - "world-system-preview.html"
      - "tests/world-system-node-tests.mjs"
      - ".github/workflows/world-system-checks.yml"

jobs:
  world-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check World System module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            worldDistrictSchema.js \
            worldDistrictFactory.js \
            worldBuilder.js \
            worldParcelBuilder.js \
            worldDistrictProxyBuilder.js \
            worldTerrainMath.js \
            worldTerrainBuilder.js \
            worldAccessGate.js \
            worldNavigation.js \
            worldDistrictStreaming.js \
            worldSystemRuntime.js \
            worldSystem.js \
            worldDistricts/conferenceCenter.js
          do
            node --input-type=module --check < "$file"
          done

      - name: Check preview module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("world-system-preview.html").read_text()
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Preview module script was not found.")
          Path("/tmp/world-system-preview.mjs").write_text(match.group(1))
          PY
          node --check /tmp/world-system-preview.mjs

      - name: Run pure World System tests
        run: node tests/world-system-node-tests.mjs
      - name: Run the full Three.js preview assertions in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/lambo-city-browser playwright
          /tmp/lambo-city-browser/node_modules/.bin/playwright install chromium
          python3 -m http.server 8000 --directory . >/tmp/lambo-city-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { chromium } from "/tmp/lambo-city-browser/node_modules/playwright/index.mjs";
          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          try {
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const pageErrors = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            await page.goto("http://127.0.0.1:8000/world-system-preview.html", { waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => {
              const value = document.querySelector("#status")?.textContent || "";
              return value.startsWith("All district, terrain, parcel") ||
                value === "The district could not be generated.";
            }, null, { timeout: 90000 });
            const status = await page.locator("#status").textContent();
            const details = await page.locator("#error").textContent().catch(() => "");
            if (!status.startsWith("All district, terrain, parcel")) {
              throw new Error("Preview failed. Status: " + status + "\\nDetails: " + details);
            }
            if (pageErrors.length) throw new Error(pageErrors.join("\\n"));
            console.log(status);
          } finally {
            await browser.close();
          }
          JS

      - "scripts/test-mpc-sampler-storage.mjs"
      - "scripts/test-daw-session-package.mjs"
      - "scripts/test-daw-session-templates.mjs"
      - "scripts/test-daw-arrangement-playback.mjs"
      - "scripts/test-daw-mp3-export.mjs"
      - "scripts/test-daw-wav-export.mjs"
      - "scripts/test-studio-standalone-boundary.mjs"
      - "scripts/test-studio-spacebar-transport.mjs"
      - "scripts/test-floor2-studio-navigation.mjs"
      - "vendor/lamejs/lame.min.js"
      - "THIRD_PARTY_NOTICES.md"

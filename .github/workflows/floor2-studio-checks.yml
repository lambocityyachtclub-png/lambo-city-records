name: Floor 2 Studio Checks

on:
  push:
    paths:
      - "floor2StudioApp.js"
      - "floor2StudioNavigation.js"
      - "floor2InstrumentApp.js"
      - "floor2DrumStation.js"
      - "recordsHQFloor2Studio.js"
      - "studioDAWApp.js"
      - "studioDAWEditScreen.js"
      - "studioMixMasterApp.js"
      - "studioDAWWorkspace.js"
      - "studioDAWBeatLabPanel.js"
      - "studioDAWEditPanel.js"
      - "studioDAWSessionTemplates.js"
      - "studioDAWTimeline.js"
      - "studioDAWArrangementPlayback.js"
      - "studioDAWExport.js"
      - "studioDAWSessionStore.js"
      - "studioMultitrackWorkspace.js"
      - "studioAudioEngine.js"
      - "studioSoundKit.js"
      - "studioAudioExport.js"
      - "studioRecordingEngine.js"
      - "studioVocalEffects.js"
      - "studioPitchCorrection.js"
      - "studioPitchCorrectionWorklet.js"
      - "scripts/test-studio-pitch-correction.mjs"
      - "studioSongProject.js"
      - "studioProjectPackage.js"
      - "mpc-interface.js"
      - "studioMPCLibrary.js"
      - "studioMPCSampler.js"
      - "scripts/test-mpc-project-package.mjs"
      - "scripts/test-mpc-library.mjs"
      - "scripts/test-mpc-audio-routing.mjs"
      - "scripts/test-mpc-sampler-storage.mjs"
      - "scripts/test-daw-session-package.mjs"
      - "scripts/test-daw-session-templates.mjs"
      - "scripts/test-daw-arrangement-playback.mjs"
      - "scripts/test-daw-mp3-export.mjs"
      - "vendor/lamejs/lame.min.js"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/floor2-studio-checks.yml"

  pull_request:
    paths:
      - "floor2StudioApp.js"
      - "floor2StudioNavigation.js"
      - "floor2InstrumentApp.js"
      - "floor2DrumStation.js"
      - "recordsHQFloor2Studio.js"
      - "studioDAWApp.js"
      - "studioDAWWorkspace.js"
      - "studioDAWBeatLabPanel.js"
      - "studioDAWEditPanel.js"
      - "studioDAWSessionTemplates.js"
      - "studioDAWTimeline.js"
      - "studioDAWArrangementPlayback.js"
      - "studioDAWExport.js"
      - "studioDAWSessionStore.js"
      - "studioMultitrackWorkspace.js"
      - "studioAudioEngine.js"
      - "studioSoundKit.js"
      - "studioAudioExport.js"
      - "studioRecordingEngine.js"
      - "studioVocalEffects.js"
      - "studioSongProject.js"
      - "studioProjectPackage.js"
      - "mpc-interface.js"
      - "studioMPCLibrary.js"
      - "studioMPCSampler.js"
      - "scripts/test-mpc-project-package.mjs"
      - "scripts/test-mpc-library.mjs"
      - "scripts/test-mpc-audio-routing.mjs"
      - "scripts/test-mpc-sampler-storage.mjs"
      - "scripts/test-daw-session-package.mjs"
      - "scripts/test-daw-session-templates.mjs"
      - "scripts/test-daw-arrangement-playback.mjs"
      - "scripts/test-daw-mp3-export.mjs"
      - "vendor/lamejs/lame.min.js"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/floor2-studio-checks.yml"

  workflow_dispatch:

jobs:
  syntax:
    name: Check Floor 2 Studio JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse Floor 2 production modules
        run: |
          for file in \
            floor2StudioApp.js \
            floor2StudioNavigation.js \
            floor2InstrumentApp.js \
            floor2DrumStation.js \
            recordsHQFloor2Studio.js \
            studioDAWApp.js \
            studioDAWEditScreen.js \
            studioMixMasterApp.js \
            studioDAWWorkspace.js \
            studioDAWBeatLabPanel.js \
            studioDAWEditPanel.js \
            studioDAWSessionTemplates.js \
            studioDAWTimeline.js \
            studioDAWArrangementPlayback.js \
            studioDAWExport.js \
            studioDAWSessionStore.js \
            studioMultitrackWorkspace.js \
            studioAudioEngine.js \
            studioSoundKit.js \
            studioAudioExport.js \
            studioRecordingEngine.js \
            studioVocalEffects.js \
            studioPitchCorrection.js \
            studioPitchCorrectionWorklet.js \
            studioSongProject.js \
            studioProjectPackage.js \
            mpc-interface.js \
            studioMPCLibrary.js \
            studioMPCSampler.js
          do
            node --experimental-default-type=module --check "$file"
          done

      - name: Test portable MPC song package
        run: node --experimental-default-type=module scripts/test-mpc-project-package.mjs

      - name: Test MPC sound library persistence
        run: node --experimental-default-type=module scripts/test-mpc-library.mjs

      - name: Test MPC audio routing and pad mix
        run: node --experimental-default-type=module scripts/test-mpc-audio-routing.mjs

      - name: Test MPC sample storage and portable assets
        run: node --experimental-default-type=module scripts/test-mpc-sampler-storage.mjs

      - name: Test portable DAW session package
        run: node --experimental-default-type=module scripts/test-daw-session-package.mjs

      - name: Test DAW session starter templates
        run: node --experimental-default-type=module scripts/test-daw-session-templates.mjs

      - name: Test DAW arrangement playback and mixer
        run: node --experimental-default-type=module scripts/test-daw-arrangement-playback.mjs

      - name: Test DAW MP3 encoder
        run: node --experimental-default-type=module scripts/test-daw-mp3-export.mjs

      - name: Test vocal pitch correction DSP
        run: node --experimental-default-type=module scripts/test-studio-pitch-correction.mjs

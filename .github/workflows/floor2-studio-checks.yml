  pull_request:
    paths:
      - "main.js"
      - "studioMixMasterConsole3D.js"
      - "floor2LiveDrummer.js"
      - "floor2VocalBooth3D.js"
      - "floor2CitySynth.js"
      - "scripts/test-studio-interface-workflow.mjs"
      - "floor2StudioApp.js"
      - "floor2StudioNavigation.js"
      - "floor2InstrumentApp.js"
      - "floor2DrumStation.js"
      - "recordsHQFloor2Studio.js"
      - "studioDAWApp.js"
      - "studioStandalone.js"
      - "studioDAWWorkspace.js"
      - "studioDAWBeatLabPanel.js"
      - "studioDAWEditPanel.js"
      - "studioDAWSessionTemplates.js"
      - "studioDAWTimeline.js"
      - "studioDAWArrangementPlayback.js"
      - "studioMidiFile.js"
      - "scripts/test-studio-midi-file.mjs"
      - "scripts/test-studio-multitrack-recording.mjs"
      - "studioDAWExport.js"
      - "studioDAWSessionStore.js"
      - "studioMultitrackWorkspace.js"
      - "studioAudioEngine.js"
      - "studioSoundKit.js"
      - "studioAudioExport.js"
      - "studioRecordingEngine.js"
      - "studioVocalEffects.js"
      - "studioSongProject.js"
      - "studioProjectPackage.js"
      - "mpc-interface.js"
      - "studioMPCLibrary.js"
      - "studioMPCSampler.js"
      - "scripts/test-mpc-project-package.mjs"
      - "scripts/test-mpc-library.mjs"
      - "scripts/test-mpc-audio-routing.mjs"
      - "scripts/test-mpc-sampler-storage.mjs"
      - "scripts/test-daw-session-package.mjs"
      - "scripts/test-daw-session-templates.mjs"
      - "scripts/test-daw-arrangement-playback.mjs"
      - "scripts/test-daw-mp3-export.mjs"
      - "scripts/test-studio-standalone-boundary.mjs"
      - "vendor/lamejs/lame.min.js"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/floor2-studio-checks.yml"

  workflow_dispatch:

jobs:
  syntax:
    name: Check Floor 2 Studio JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse Floor 2 production modules
        run: |
          for file in \
            main.js \
            studioMixMasterConsole3D.js \
            floor2LiveDrummer.js \
            floor2VocalBooth3D.js \
            floor2CitySynth.js \
            floor2StudioApp.js \
            floor2StudioNavigation.js \
            floor2InstrumentApp.js \
            floor2DrumStation.js \
            recordsHQFloor2Studio.js \
            studioDAWApp.js \
            studioStandalone.js \
            studioDAWEditScreen.js \
            studioMixMasterApp.js \
            studioDAWWorkspace.js \
            studioDAWMidiEditor.js \
            studioDAWBeatLabPanel.js \
            studioDAWEditPanel.js \
            studioDAWSessionTemplates.js \
            studioDAWSessionLayouts.js \
            studioDAWTimeline.js \
            studioDAWArrangementPlayback.js \
            studioMetronome.js \
            studioMidiFile.js \
            studioDAWExport.js \
            studioDAWSessionStore.js \
            studioMultitrackWorkspace.js \
            studioAudioEngine.js \
            studioSoundKit.js \
            studioAudioExport.js \
            studioRecordingEngine.js \
            studioPCMRecorder.js \
            studioPCMRecorderWorklet.js \
            studioVocalEffects.js \
            studioPitchCorrection.js \
            studioPitchCorrectionWorklet.js \
            studioSongProject.js \
            studioProjectPackage.js \
            mpc-interface.js \
            studioMPCLibrary.js \
            studioMPCSampler.js
          do
            node --experimental-default-type=module --check "$file"
          done

      - name: Test portable MPC song package
        run: node --experimental-default-type=module scripts/test-mpc-project-package.mjs

      - name: Test MPC sound library persistence
        run: node --experimental-default-type=module scripts/test-mpc-library.mjs

      - name: Test MPC audio routing and pad mix
        run: node --experimental-default-type=module scripts/test-mpc-audio-routing.mjs

      - name: Test MPC sample storage and portable assets
        run: node --experimental-default-type=module scripts/test-mpc-sampler-storage.mjs

      - name: Test portable DAW session package
        run: node --experimental-default-type=module scripts/test-daw-session-package.mjs

      - name: Test DAW session starter templates
        run: node --experimental-default-type=module scripts/test-daw-session-templates.mjs

      - name: Test multi-genre session layouts
        run: node --experimental-default-type=module scripts/test-daw-session-layouts.mjs

      - name: Test DAW arrangement playback and mixer
        run: node --experimental-default-type=module scripts/test-daw-arrangement-playback.mjs

      - name: Test master limiter and output meter
        run: node --experimental-default-type=module scripts/test-studio-master-processing.mjs

      - name: Test Studio metronome timing and meter changes
        run: node --experimental-default-type=module scripts/test-studio-metronome.mjs

      - name: Test MIDI file import and export
        run: node --experimental-default-type=module scripts/test-studio-midi-file.mjs

      - name: Test simultaneous armed-track recording
        run: node --experimental-default-type=module scripts/test-studio-multitrack-recording.mjs

      - name: Test DAW MP3 encoder
        run: node --experimental-default-type=module scripts/test-daw-mp3-export.mjs

      - name: Test Studio WAV PCM export formats
        run: node --experimental-default-type=module scripts/test-daw-wav-export.mjs

      - name: Test uncompressed PCM recording adapter
        run: node --experimental-default-type=module scripts/test-studio-pcm-recorder.mjs

      - name: Test vocal pitch correction DSP
        run: node --experimental-default-type=module scripts/test-studio-pitch-correction.mjs

      - name: Test standalone Studio dependency boundary
        run: node --experimental-default-type=module scripts/test-studio-standalone-boundary.mjs

      - name: Test shared Studio Spacebar transport
        run: node --experimental-default-type=module scripts/test-studio-spacebar-transport.mjs

      - name: Test approved five-step music interface workflow
        run: node --experimental-default-type=module scripts/test-studio-interface-workflow.mjs

      - name: Test Floor 2 Studio station registration and navigation
        run: node --experimental-default-type=module scripts/test-floor2-studio-navigation.mjs

      - name: Test Vocal Booth, Voice Notes, and piano MIDI integration
        run: node --experimental-default-type=module scripts/test-studio-vocal-piano-integration.mjs
